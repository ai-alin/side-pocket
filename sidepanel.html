<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Side Pocket</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- 展开后的完整面板 -->
  <main id="fullView" class="full-view">
    <header class="top-bar">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" data-i18n-ph="searchPh" data-i18n-label="searchPh" autocomplete="off" spellcheck="false" />
      </label>
    </header>

    <div id="scroll" class="scroll-area">
      <section id="results-section" class="section" hidden>
        <header class="sec-head"><span data-i18n="secResults"></span><span id="result-count" class="num"></span></header>
        <div id="results" class="tree"></div>
      </section>

      <div id="browse">
        <section id="pinned-section" class="section">
          <header class="sec-head" data-sec="pinned" role="button" tabindex="0" aria-expanded="true"><span data-i18n="secPinned"></span><span class="sec-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="M4.2 2.5 7.7 6 4.2 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></header>
          <div id="pinned" class="pinned-list"></div>
        </section>

        <section id="saved-section" class="section">
          <header class="sec-head" data-sec="saved" role="button" tabindex="0" aria-expanded="true"><span data-i18n="secSaved"></span><span class="sec-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="M4.2 2.5 7.7 6 4.2 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></header>
          <div id="saved" class="tree"></div>
          <button id="new-folder" class="row ghost-row" type="button">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15.4H4.5c-.97 0-1.75-.78-1.75-1.75V5.6c0-.97.78-1.75 1.75-1.75h3.05l1.65 1.8h6.3c.97 0 1.75.78 1.75 1.75v2.3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 12v5M12.5 14.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="title" data-i18n="newFolder"></span>
          </button>
        </section>

        <!-- 和 Chrome 标签栏一模一样：这个窗口的所有标签，顺序一致 -->
        <section id="window-section" class="section">
          <header class="sec-head" data-sec="window" role="button" tabindex="0" aria-expanded="true"><span data-i18n="secWindow"></span><span id="tab-count" class="num"></span><span class="sec-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="M4.2 2.5 7.7 6 4.2 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></header>
          <div id="tabs" class="tree"></div>
          <button id="new-tab" class="row ghost-row" type="button">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="title" data-i18n="newTabBtn"></span>
          </button>
        </section>

        <!-- 别的电脑上开着的网页：只读，点一下在这台电脑打开 -->
        <section id="devices-section" class="section">
          <header class="sec-head" data-sec="devices" role="button" tabindex="0" aria-expanded="true"><span data-i18n="secDevices"></span><span class="sec-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="M4.2 2.5 7.7 6 4.2 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></header>
          <div id="devices" class="tree"></div>
        </section>
      </div>
    </div>

    <footer class="side-footer">
      <span id="sync-state" class="sync-state"></span>
      <button id="open-settings" class="icon-btn" type="button" data-i18n-title="settings">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7 3.6 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </main>

  <div id="settings-pop" class="settings-pop" hidden>
    <!-- 外观：只对这台电脑生效（每台电脑装的字体不一样） -->
    <div class="settings-title" data-i18n="appearance"></div>
    <label class="settings-field"><span data-i18n="font"></span><select id="font-family"></select></label>
    <label class="settings-field"><span data-i18n="weightNormal"></span><select id="font-weight"></select></label>
    <label class="settings-field"><span data-i18n="weightStrong"></span><select id="font-strong"></select></label>
    <label class="settings-field"><span data-i18n="fontSize"></span><select id="font-size"></select></label>
    <label class="settings-field"><span data-i18n="language"></span><select id="lang"></select></label>
    <p class="settings-note settings-note-tight" data-i18n="fontNote"></p>
    <button id="reset-look" class="settings-btn" type="button" data-i18n="resetLook"></button>

    <div class="settings-title settings-title-gap" data-i18n="deviceNameTitle"></div>
    <input id="device-name" class="settings-input" type="text" maxlength="40" data-i18n-ph="deviceNamePh" data-i18n-label="deviceNameTitle" autocomplete="off" spellcheck="false" />
    <p class="settings-note settings-note-tight" data-i18n="deviceNameNote"></p>

    <div class="settings-title settings-title-gap" data-i18n="secDevices"></div>
    <label class="settings-check">
      <input id="share-tabs" type="checkbox" checked />
      <span data-i18n="shareLabel"></span>
    </label>
    <p class="settings-note settings-note-tight" data-i18n="shareNote"></p>

    <div class="settings-title settings-title-gap" data-i18n="shortcutTitle"></div>
    <div class="shortcut-row">
      <span data-i18n="toggleSide"></span>
      <kbd id="shortcut-key" class="shortcut-key"></kbd>
    </div>
    <p id="shortcut-hint" class="settings-note warn" hidden data-i18n="shortcutHint"></p>
    <button id="edit-shortcut" class="settings-btn" type="button" data-i18n="editShortcut"></button>

    <p class="settings-note" data-i18n="sideNote"></p>
  </div>

  <div id="drop-line" class="drop-line" hidden></div>
  <div id="status" class="status" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
